services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ipd
      POSTGRES_USER: ipd
      POSTGRES_PASSWORD: ipd
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro]
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes: [./backend:/app]
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
